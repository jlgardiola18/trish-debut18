<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Floral Debut | A Message for You</title>
    <link rel="icon" type="image/png" href="files/flower.png">
    <link rel="stylesheet" href="style.css" />

<body class="floral-bg book-page">
    <audio id="backgroundSound" src="files/background music.mp3" loop preload="auto"></audio>
    <button class="sound-toggle" id="soundToggle" type="button" aria-pressed="false">♫ Play sound</button>
    <section class="mobile-reader" aria-label="Photo book">

        </div>
    </section>
    <div class="book">
        <div class="page">
            <div class="front cover">
                <img src="files/01.jpg" alt="01.jpg" />

            <div class="back">

            </div>
        </div>
